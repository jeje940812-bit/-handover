<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>업무 인수인계 자동화 | KT DS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');

  :root {
    --mint:      #00BFA5;
    --mint-dark: #00897B;
    --accent:    #3D53FF;
    --bg:        #F4F5F9;
    --surface:   #FFFFFF;
    --border:    #E2E4EC;
    --text:      #1A1D2E;
    --sub:       #6B7280;
    --success:   #059669;
    --error:     #DC2626;
    --radius:    12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 5rem;
  }

  /* 헤더 */
  header {
    background: var(--mint);
    color: #fff;
    height: 56px;
    padding: 0 2rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,191,165,0.3);
  }
  .logo {
    background: rgba(255,255,255,0.25);
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 6px;
    padding: 3px 10px;
    font-size: 12px;
    font-weight: 700;
  }
  header h1 { font-size: 15px; font-weight: 500; }

  /* 탭 */
  .tabs {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    padding: 0 2rem;
    position: sticky;
    top: 56px;
    z-index: 99;
  }
  .tab {
    height: 48px;
    padding: 0 1.25rem;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 14px;
    color: var(--sub);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all .2s;
  }
  .tab.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }

  /* 컨테이너 */
  .wrap { max-width: 900px; margin: 0 auto; padding: 1.5rem; }

  /* 패널 */
  .panel { display: none; }
  .panel.on { display: block; }

  /* 카드 */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.5rem;
    margin-bottom: 1rem;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .card-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--sub);
    text-transform: uppercase;
    letter-spacing: .8px;
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .card-title::before {
    content: '';
    width: 3px; height: 14px;
    background: var(--mint);
    border-radius: 2px;
    display: block;
  }

  /* 폼 */
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
  .field { display: flex; flex-direction: column; gap: .3rem; }
  .field label { font-size: 12px; font-weight: 500; color: var(--sub); }
  .field input, .field select {
    font-family: inherit;
    font-size: 14px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: .55rem .75rem;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .field input:focus, .field select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(61,83,255,.1);
    background: #fff;
  }

  /* 업무 유형 카드 */
  .type-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
  .type-card {
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem;
    cursor: pointer;
    transition: all .2s;
    background: var(--bg);
    user-select: none;
  }
  .type-card:hover { border-color: var(--accent); }
  .type-card.on {
    border-color: var(--accent);
    background: #eef0ff;
    box-shadow: 0 0 0 3px rgba(61,83,255,.1);
  }
  .type-card.on .type-name { color: var(--accent); }
  .type-icon { font-size: 24px; margin-bottom: .4rem; }
  .type-name { font-size: 14px; font-weight: 600; }
  .type-desc { font-size: 12px; color: var(--sub); margin-top: .2rem; line-height: 1.4; }

  /* 버튼 */
  .btn {
    display: inline-flex; align-items: center; gap: .4rem;
    padding: .65rem 1.4rem;
    border-radius: 8px;
    border: none;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all .2s;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #2c42e0; box-shadow: 0 4px 12px rgba(61,83,255,.35); }
  .btn-primary:disabled { background: #a0a7d1; cursor: not-allowed; box-shadow: none; }
  .btn-ghost { background: none; color: var(--sub); border: 1px solid var(--border); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
  .btns { display: flex; gap: .5rem; margin-top: 1rem; }

  /* 로딩 */
  .loading {
    display: none;
    background: #eef0ff;
    border: 1px solid #c7cdff;
    border-radius: var(--radius);
    padding: 1.5rem;
    text-align: center;
    margin: 1rem 0;
  }
  .loading.on { display: block; }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid #c7cdff;
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
    margin: 0 auto .75rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-msg { font-size: 14px; color: var(--accent); font-weight: 500; }

  /* 결과 */
  .result {
    display: none;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    margin-top: 1rem;
  }
  .result.on { display: block; }
  .result-bar {
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: .75rem 1.25rem;
    display: flex;
    align-items: center;
    gap: .5rem;
  }
  .result-label { font-size: 12px; font-weight: 600; color: var(--sub); margin-right: auto; }
  .result-body {
    padding: 1.5rem 2rem;
    font-size: 14px;
    line-height: 1.8;
    min-height: 300px;
    max-height: 600px;
    overflow-y: auto;
  }
  .result-body h2 {
    font-size: 15px; font-weight: 700;
    color: #003087;
    border-bottom: 2px solid var(--border);
    padding-bottom: .4rem;
    margin: 1.5rem 0 .75rem;
  }
  .result-body h2:first-child { margin-top: 0; }
  .result-body h4 { font-size: 13px; font-weight: 700; margin: 1rem 0 .4rem; }
  .result-body table { width: 100%; border-collapse: collapse; margin: .5rem 0; font-size: 13px; }
  .result-body th { background: var(--bg); border: 1px solid var(--border); padding: .45rem .7rem; font-weight: 600; text-align: left; }
  .result-body td { border: 1px solid var(--border); padding: .45rem .7rem; }
  .result-body tr:nth-child(even) td { background: #fafbfc; }
  .result-body hr { border: none; border-top: 1px solid var(--border); margin: 1rem 0; }

  /* 이력 */
  .hist-list { display: flex; flex-direction: column; gap: .6rem; }
  .hist-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem 1.2rem;
    display: flex; align-items: center; gap: 1rem;
    cursor: pointer;
    transition: box-shadow .2s;
  }
  .hist-item:hover { box-shadow: 0 4px 12px rgba(0,0,0,.08); border-color: var(--accent); }
  .badge {
    padding: 3px 10px; border-radius: 20px;
    font-size: 11px; font-weight: 600; flex-shrink: 0;
  }
  .b-sec  { background: #EFF6FF; color: #1D4ED8; border: 1px solid #BFDBFE; }
  .b-safe { background: #F0FDF4; color: #166534; border: 1px solid #BBF7D0; }
  .b-both { background: #FFF7ED; color: #92400E; border: 1px solid #FDE68A; }
  .hist-info { flex: 1; }
  .hist-name { font-size: 14px; font-weight: 500; }
  .hist-meta { font-size: 12px; color: var(--sub); margin-top: 2px; }
  .hist-date { font-size: 12px; color: var(--sub); }

  /* 설정 */
  .status-row { display: flex; align-items: center; gap: .5rem; margin-bottom: .5rem; }
  .pill { display: inline-flex; align-items: center; gap: .3rem; font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: 20px; }
  .pill-ok { background: #ECFDF5; color: var(--success); border: 1px solid #6EE7B7; }
  .acc-email { font-size: 12px; color: var(--sub); font-family: monospace; background: var(--bg); padding: .4rem .75rem; border-radius: 6px; }

  /* 토스트 */
  .toast {
    position: fixed; bottom: 5rem; right: 1.5rem;
    background: #1A1D2E; color: #fff;
    padding: .7rem 1.2rem; border-radius: 10px;
    font-size: 13px; font-weight: 500;
    box-shadow: 0 4px 20px rgba(0,0,0,.25);
    z-index: 9999;
    transform: translateY(80px); opacity: 0;
    transition: all .3s cubic-bezier(.34,1.56,.64,1);
  }
  .toast.on { transform: translateY(0); opacity: 1; }
  .toast.ok  { background: #064E3B; }
  .toast.err { background: #7F1D1D; }

  @media (max-width: 600px) {
    .grid2, .type-grid { grid-template-columns: 1fr; }
    .wrap { padding: 1rem; }
  }
</style>
</head>
<body>

<!-- 헤더 -->
<header>
  <div class="logo">KT DS</div>
  <h1>업무 인수인계 자동화 시스템</h1>
</header>

<!-- 탭 -->
<div class="tabs">
  <button class="tab on" onclick="switchTab('gen', this)">📝 인수인계서 생성</button>
  <button class="tab" onclick="switchTab('hist', this)">📋 이력 조회</button>
  <button class="tab" onclick="switchTab('cfg', this)">⚙️ 설정</button>
</div>

<!-- 생성 패널 -->
<div id="panel-gen" class="panel on">
<div class="wrap">

  <div class="card">
    <div class="card-title">인수인계 기본 정보</div>
    <div class="grid2">
      <div class="field">
        <label>인계자 (나가는 담당자)</label>
        <input id="from-name" type="text" placeholder="예) 홍길동" oninput="validate()">
      </div>
      <div class="field">
        <label>인수자 (들어오는 담당자)</label>
        <input id="to-name" type="text" placeholder="예) 김철수" oninput="validate()">
      </div>
      <div class="field">
        <label>인계 시작일</label>
        <input id="date-start" type="date" oninput="validate()">
      </div>
      <div class="field">
        <label>인계 종료일</label>
        <input id="date-end" type="date">
      </div>
      <div class="field">
        <label>소속 부서</label>
        <input id="dept" type="text" placeholder="예) IT인프라운영팀">
      </div>
      <div class="field">
        <label>인계 사유</label>
        <select id="reason">
          <option value="">선택하세요</option>
          <option>인사이동</option>
          <option>퇴직</option>
          <option>휴직</option>
          <option>부서이동</option>
          <option>기타</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">인수인계 업무 유형</div>
    <div class="type-grid">
      <div class="type-card" id="card-sec" onclick="toggleType('sec')">
        <div class="type-icon">🔒</div>
        <div class="type-name">정보보호 업무</div>
        <div class="type-desc">협력사 FTC 승인, Security Clean DAY, 정보보호 감사 등</div>
      </div>
      <div class="type-card" id="card-safe" onclick="toggleType('safe')">
        <div class="type-icon">🦺</div>
        <div class="type-name">산업안전보건 업무</div>
        <div class="type-desc">주차별 순회 점검, 안전보건 교육, 위험성 평가 등</div>
      </div>
    </div>
  </div>

  <div class="btns">
    <button class="btn btn-primary" id="btn-gen" onclick="generate()" disabled>✨ AI 인수인계서 생성</button>
    <button class="btn btn-ghost" onclick="reset()">↺ 초기화</button>
  </div>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div class="loading-msg" id="loading-msg">잠시만 기다려주세요...</div>
  </div>

  <div class="result" id="result">
    <div class="result-bar">
      <span class="result-label">📄 생성된 인수인계서</span>
      <button class="btn btn-ghost" onclick="copyDoc()" style="font-size:12px;padding:.4rem .9rem">📋 복사</button>
      <button class="btn btn-ghost" onclick="window.print()" style="font-size:12px;padding:.4rem .9rem">🖨 인쇄</button>
      <button class="btn btn-primary" onclick="saveKms()" style="font-size:12px;padding:.4rem .9rem">💾 KMS 저장</button>
    </div>
    <div class="result-body" id="result-body"></div>
  </div>

</div>
</div>

<!-- 이력 패널 -->
<div id="panel-hist" class="panel">
<div class="wrap">
  <div class="card">
    <div class="card-title">생성 이력</div>
    <div class="hist-list" id="hist-list">
      <div style="text-align:center;padding:2rem;color:var(--sub);font-size:14px;">아직 생성된 인수인계서가 없습니다.</div>
    </div>
  </div>
</div>
</div>

<!-- 설정 패널 -->
<div id="panel-cfg" class="panel">
<div class="wrap">
  <div class="card">
    <div class="card-title">Confluence KMS 연동 설정</div>
    <p style="font-size:13px;color:var(--sub);margin-bottom:1rem;line-height:1.6">
      설정값은 브라우저에만 저장되며 외부로 전송되지 않습니다.
    </p>
    <div class="field" style="margin-bottom:.75rem">
      <label>서비스 계정 이메일</label>
      <input type="text" id="cfg-email" placeholder="xxxxx@serviceaccount.atlassian.com"
        style="font-family:monospace;font-size:13px"
        oninput="saveCfg()">
    </div>
    <div class="field" style="margin-bottom:1rem">
      <label>API Token</label>
      <input type="password" id="cfg-token" placeholder="ATSS..."
        style="font-family:monospace;font-size:13px"
        oninput="saveCfg()">
    </div>
    <div class="btns">
      <button class="btn btn-primary" onclick="testConn()">🔌 연결 테스트</button>
      <button class="btn btn-ghost" onclick="clearCfg()">🗑 초기화</button>
    </div>
  </div>

</div>
</div>

<!-- 토스트 -->
<div class="toast" id="toast"></div>



<!-- 앱 로직 -->
<script>
// ── 탭 ──────────────────────────────────────────
function switchTab(name, btn) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('on'));
  document.getElementById('panel-' + name).classList.add('on');
  btn.classList.add('on');
}

// ── 업무 유형 ────────────────────────────────────
const selected = new Set();
function toggleType(type) {
  const card = document.getElementById('card-' + type);
  if (selected.has(type)) {
    selected.delete(type);
    card.classList.remove('on');
  } else {
    selected.add(type);
    card.classList.add('on');
  }
  validate();
}

// ── 유효성 ──────────────────────────────────────
function validate() {
  const ok = document.getElementById('from-name').value.trim()
           && document.getElementById('to-name').value.trim()
           && document.getElementById('date-start').value
           && selected.size > 0;
  document.getElementById('btn-gen').disabled = !ok;
}

// ── 인수인계서 생성 ──────────────────────────────
let docText = '';

async function generate() {
  const fromName  = document.getElementById('from-name').value.trim();
  const toName    = document.getElementById('to-name').value.trim();
  const dept      = document.getElementById('dept').value.trim();
  const dateStart = document.getElementById('date-start').value;
  const dateEnd   = document.getElementById('date-end').value;
  const reason    = document.getElementById('reason').value;
  const types     = [...selected].map(t => t === 'sec' ? 'security' : 'safety');
  const typeLabel = [...selected].map(t => t === 'sec' ? '정보보호 업무' : '산업안전보건 업무').join(', ');

  document.getElementById('btn-gen').disabled = true;
  document.getElementById('result').classList.remove('on');
  document.getElementById('loading').classList.add('on');

  setMsg('KMS에서 최신 업무 내용 읽는 중...');

  // KMS 직접 조회 (서버 불필요)
  let kmsContent = '';
  try {
    const pages = await fetchKmsPages(types);
    const validPages = pages.filter(p => p.text);
    if (validPages.length > 0) {
      kmsContent = validPages.map(p => '[' + p.title + ']\n' + p.text).join('\n\n---\n\n');
      toast('KMS 최신 내용 로딩 완료!', 'ok');
    } else {
      toast('KMS 내용이 비어있습니다 — 기본 템플릿으로 생성합니다', '');
    }
  } catch(e) {
    toast('KMS 조회 실패 — 기본 템플릿으로 생성합니다', '');
  }

  // KMS 내용 기반 템플릿 생성
  setMsg('인수인계서 작성 중...');
  await sleep(400);
  docText = makeTemplate({ fromName, toName, dept, dateStart, dateEnd, reason, typeLabel, selected, kmsContent });

  document.getElementById('loading').classList.remove('on');
  document.getElementById('result-body').innerHTML = mdToHtml(docText);
  document.getElementById('result').classList.add('on');
  document.getElementById('btn-gen').disabled = false;

  saveHist({ fromName, toName, typeLabel, dateStart, docText });
  toast('인수인계서 생성 완료!', 'ok');
}

function setMsg(msg) {
  document.getElementById('loading-msg').textContent = msg;
}

// ── AI:ON-U API ──────────────────────────────────
// ── Confluence 설정 (localStorage에서 읽기) ──
const CONF_BASE   = 'https://api.atlassian.com/ex/confluence/bdea0a2b-a1f6-4364-812a-44b02e61e998/wiki/api/v2';
const CONF_LEGACY = 'https://api.atlassian.com/ex/confluence/bdea0a2b-a1f6-4364-812a-44b02e61e998/wiki/rest/api';

function getAuth() {
  const email = localStorage.getItem('conf_email') || '';
  const token = localStorage.getItem('conf_token') || '';
  if (!email || !token) {
    toast('설정 탭에서 이메일과 토큰을 먼저 입력해주세요', 'err');
    return null;
  }
  return btoa(email + ':' + token);
}

const KMS_PAGES = {
  security: { id: '407307427', title: '정보보호 업무' },
  safety:   { id: '407471178', title: '산업안전보건 업무' },
};

async function fetchKmsPages(types) {
  const auth = getAuth();
  if (!auth) throw new Error('인증 정보 없음');
  const results = [];
  for (const type of types) {
    const page = KMS_PAGES[type];
    if (!page) continue;
    const res  = await fetch(CONF_BASE + '/pages/' + page.id + '?body-format=storage', {
      headers: { 'Authorization': 'Basic ' + auth, 'Accept': 'application/json' }
    });
    if (!res.ok) throw new Error('Confluence API HTTP ' + res.status);
    const data = await res.json();
    const text = htmlToText(data.body?.storage?.value || '');
    results.push({ type, title: page.title, text });
  }
  return results;
}

function htmlToText(html) {
  return html
    .replace(/<\/(p|div|tr|li|h[1-6])>/gi, '\n')
    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/<\/t[dh]>/gi, '\t')
    .replace(/<[^>]+>/g, '')
    .replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>')
    .replace(/&nbsp;/g, ' ').replace(/&quot;/g, '"')
    .replace(/[ \t]+/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
}





// ── 로컬 템플릿 ──────────────────────────────────
function makeTemplate({ fromName, toName, dept, dateStart, dateEnd, reason, typeLabel, selected, kmsContent }) {
  const today   = new Date().toLocaleDateString('ko-KR');
  const hasSec  = selected.has('sec');
  const hasSafe = selected.has('safe');
  let doc = '';

  doc += '## 1. 인수인계 개요\n\n';
  doc += '| 항목 | 내용 |\n|------|------|\n';

// ── 마크다운 → HTML ──────────────────────────────
function mdToHtml(md) {
  if (!md) return '';
  const lines = md.split('\n');
  let html = '', inTable = false, tableHtml = '', firstRow = true;

  for (const line of lines) {
    if (/^\|[-| :]+\|$/.test(line.trim())) { firstRow = false; continue; }

    if (line.trim().startsWith('|') && line.trim().endsWith('|')) {
      if (!inTable) { inTable = true; firstRow = true; tableHtml = '<table>'; }
      const cells = line.trim().slice(1, -1).split('|').map(c => c.trim());
      if (firstRow) {
        tableHtml += '<tr>' + cells.map(c => '<th>' + c + '</th>').join('') + '</tr>';
        firstRow = false;
      } else {
        tableHtml += '<tr>' + cells.map(c => '<td>' + c + '</td>').join('') + '</tr>';
      }
      continue;
    }

    if (inTable) { html += tableHtml + '</table>'; inTable = false; tableHtml = ''; firstRow = true; }

    if (/^#### /.test(line))     html += '<h4>' + line.replace(/^#### /, '') + '</h4>';
    else if (/^### /.test(line)) html += '<h3>' + line.replace(/^### /, '') + '</h3>';
    else if (/^## /.test(line))  html += '<h2>' + line.replace(/^## /, '') + '</h2>';
    else if (/^---$/.test(line.trim())) html += '<hr>';
    else if (line.trim() === '') html += '<br>';
    else html += '<p style="margin:.15rem 0">' + line.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>') + '</p>';
  }

  if (inTable) html += tableHtml + '</table>';
  return html;
}

async function saveKms() {
  if (!docText) { toast('먼저 인수인계서를 생성해주세요', 'err'); return; }
  const fromName = document.getElementById('from-name').value.trim();
  const toName   = document.getElementById('to-name').value.trim();
  const today    = new Date().toLocaleDateString('ko-KR');
  const title    = '[인수인계] ' + fromName + ' → ' + toName + ' (' + today + ')';
  toast('KMS에 저장 중...', '');
  try {
    const auth = getAuth();
    if (!auth) return;
    const res  = await fetch(CONF_LEGACY + '/content', {
      method : 'POST',
      headers: {
        'Authorization': 'Basic ' + auth,
        'Content-Type' : 'application/json',
        'Accept'       : 'application/json',
      },
      body: JSON.stringify({
        type    : 'page',
        title,
        ancestors: [{ id: '406653051' }],
        body    : {
          storage: {
            value          : docText.replace(/\n/g, '<br/>'),
            representation : 'storage',
          }
        }
      }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    toast('KMS 저장 완료! — ' + title, 'ok');
  } catch(e) {
    toast('KMS 저장 실패: ' + e.message, 'err');
  }
}

// ── 이력 ─────────────────────────────────────────
const HIST_KEY = 'handover_hist_v1';
function saveHist(item) {
  let list = [];
  try { list = JSON.parse(localStorage.getItem(HIST_KEY) || '[]'); } catch {}
  list.unshift({ ...item, id: Date.now(), at: new Date().toLocaleString('ko-KR') });
  localStorage.setItem(HIST_KEY, JSON.stringify(list.slice(0, 20)));
  renderHist();
}
function renderHist() {
  let list = [];
  try { list = JSON.parse(localStorage.getItem(HIST_KEY) || '[]'); } catch {}
  const el = document.getElementById('hist-list');
  if (!list.length) { el.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--sub);font-size:14px;">아직 생성된 인수인계서가 없습니다.</div>'; return; }
  el.innerHTML = list.map(h => {
    const bc = h.typeLabel.includes('정보보호') && h.typeLabel.includes('산업안전보건') ? 'b-both'
             : h.typeLabel.includes('정보보호') ? 'b-sec' : 'b-safe';
    return '<div class="hist-item" onclick="loadHist(' + h.id + ')">'
      + '<span class="badge ' + bc + '">' + h.typeLabel + '</span>'
      + '<div class="hist-info"><div class="hist-name">' + h.fromName + ' → ' + h.toName + '</div>'
      + '<div class="hist-meta">인계 시작: ' + h.dateStart + '</div></div>'
      + '<div class="hist-date">' + h.at + '</div></div>';
  }).join('');
}
function loadHist(id) {
  let list = [];
  try { list = JSON.parse(localStorage.getItem(HIST_KEY) || '[]'); } catch {}
  const item = list.find(h => h.id === id);
  if (!item) return;
  docText = item.docText;
  document.getElementById('result-body').innerHTML = mdToHtml(item.docText);
  document.getElementById('result').classList.add('on');
  switchTab('gen', document.querySelectorAll('.tab')[0]);
  toast(item.fromName + ' → ' + item.toName + ' 불러오기 완료', 'ok');
}

  selected.clear();
  document.getElementById('card-sec').classList.remove('on');
  document.getElementById('card-safe').classList.remove('on');
  document.getElementById('result').classList.remove('on');
  document.getElementById('loading').classList.remove('on');
  document.getElementById('btn-gen').disabled = true;
}

let toastTimer;
function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = type === 'ok' ? '✅ ' + msg : type === 'err' ? '❌ ' + msg : '⏳ ' + msg;
  el.className = 'toast on' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 3500);
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('date-start').value = new Date().toISOString().split('T')[0];
